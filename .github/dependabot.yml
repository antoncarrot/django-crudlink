version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      github-actions:
        patterns:
          - "*"

  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    versioning-strategy: increase-if-necessary
    ignore:
      # vue-tsc runs TypeScript 6's JS tsc; TypeScript 7 ships only the native compiler
      - dependency-name: typescript
        update-types: ["version-update:semver-major"]
    labels:
      - dependencies
      - frontend
    groups:
      npm:
        patterns:
          - "*"
